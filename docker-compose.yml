services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    environment:
      - MODEL_DIR=/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
